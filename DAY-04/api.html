<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background: #000; color: white; font-weight: bold;">
    <div style="display: flex; flex-direction: column; align-items: center; margin-top: 20px; gap: 10px; padding: 20px;color: white; font-weight: bold;gap: 20px;"  >
        <h1 Style="color: rgb(241, 50, 7); text-align: center; font-weight: bold; background: #000; height: 40px; padding: 20px;">
            Api Fetching
        </h1>
        <li Style="list-style: none; display: flex; gap: 20px;">
            <a href="index.html">Home</a>
            <a href="About.html">About</a>
            <a href="Contact.html">Contact</a>
            <a href="todo.html">To Do List</a>
        </li>
    </div>
    <div Style="display: flex; flex-direction: column; align-items: center; margin-top: 20px; gap: 10px; padding: 20px;color: white; font-weight: bold;gap: 20px;">
        <h1>Fetch API Example</h1>
        <p>Click the button below to fetch data from the API:</p>
    </div>

    <div Style="display: flex; flex-direction: column; align-items: center; margin-top: 20px; gap: 10px; padding: 20px;color: white; font-weight: bold;gap: 20px;">
        <button id="fetchButton">Fetch Data</button>
        <div id="apiData"></div>
    </div>
    <script>
        document.getElementById('fetchButton').addEventListener('click', function() {
            fetch('https://jsonplaceholder.typicode.com/posts')
                .then(response => response.json())
                .then(data => {
                    const apiDataDiv = document.getElementById('apiData');
                    apiDataDiv.innerHTML = ''; // Clear previous data
                    data.forEach(post => {
                        const postElement = document.createElement('div');
                        postElement.innerHTML = `<h3>${post.title}</h3><p>${post.body}</p>`;
                        apiDataDiv.appendChild(postElement);
                    });
                })
                .catch(error => {
                    console.error('Error fetching data:', error);
                });
        });
    </script>


</body>
</html>
