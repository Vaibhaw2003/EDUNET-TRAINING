<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <div>
        <h1 style="color: rgb(241, 50, 7); text-align: center; font-weight: bold; background: #000; height: 40px; padding: 20px;">Addition of two numbers</h1>
        <nav style="background: #000; height: 40px; padding: 10px; display: flex; justify-content: space-around;">
            <li style="list-style: none; display: flex; gap: 20px;">
                <a href="index.html" style="color: white; text-decoration: none;">Home</a>
                <a href="About.html" style="color: white; text-decoration: none;">About</a>
                <a href="Contact.html" style="color: white; text-decoration: none;">Contact</a>
                <a href="todo.html" style="color: white; text-decoration: none;">To Do List</a>
            </li>
        </nav>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; margin-top: 20px; gap: 10p; padding: 20px;color: white; font-weight: bold;gap: 20px;">
    <input Style="color: black; border: 2px solid #e10505; height: 40px; width: 400px;"  type="text" id="num1" placeholder="Enter First number">
    <input Style=" color: black; border: 2px solid #e10505; height: 40px; width: 400px;" type="text" id="num2" placeholder="Enter Second number">
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; margin-top: 20px; gap: 10px; background: #000; padding: 20px;color: white; font-weight: bold;">
         <button onclick="add()">Addition</button>
    </div>
    <h3 style="color: red;" id='result'>Result : </h3>
    <script>
        function add(){
            let n1 = document.getElementById('num1').value;
            let n2 = document.getElementById('num2').value;
            let ans = parseInt(n1)+parseInt(n2)
            document.getElementById('result').innerText ="Result : "+ ans
    }
    </script>
    
</body>
